version: '3.8'

services:
  playswap-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playswap-backend
    restart: always
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${DB_AUTH_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_AUTH_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_AUTH_PASSWORD}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    deploy:
      resources:
        limits:
          memory: 850M